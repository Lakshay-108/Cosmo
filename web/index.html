<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmo — Desktop Assistant</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Minimal Top Header -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-avatar">C</div>
                <div class="brand-info">
                    <span class="brand-name">Cosmo</span>
                    <span class="brand-status" id="sys-status">Ready</span>
                </div>
            </div>
            <div class="header-right">
                <span class="live-clock" id="live-clock">12:00 PM</span>
                <button class="settings-btn" onclick="toggleSettingsModal()" title="Settings">⚙️</button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="app-main">
            <!-- Voice Orb Hero Section -->
            <section class="voice-hero">
                <div class="orb-wrapper" id="orbWrapper" onclick="toggleVoiceRecognition()">
                    <div class="voice-orb" id="voiceOrb">
                        <div class="orb-core"></div>
                        <div class="orb-ring ring-1"></div>
                        <div class="orb-ring ring-2"></div>
                    </div>
                    <div class="orb-mic-icon" id="micIcon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="22"></line>
                        </svg>
                    </div>
                </div>
                <p class="voice-hint" id="voiceHint">Click or speak to Cosmo</p>
            </section>

            <!-- Quick Action Shortcut Pills -->
            <div class="quick-pills">
                <button class="pill" onclick="sendQuickCommand('What is your name')">
                    <span class="pill-icon">✨</span> Who are you?
                </button>
                <button class="pill" onclick="sendQuickCommand('What is the time')">
                    <span class="pill-icon">🕒</span> Time
                </button>
                <button class="pill" onclick="sendQuickCommand('Open YouTube')">
                    <span class="pill-icon">▶</span> YouTube
                </button>
                <!-- <button class="pill" onclick="sendQuickCommand('Open Spotify')">
                    <span class="pill-icon">🎵</span> Spotify
                </button> -->
                <button class="pill" onclick="sendQuickCommand('Open GitHub')">
                    <span class="pill-icon">🐙</span> GitHub
                </button>
            </div>

            <!-- Conversation Feed -->
            <section class="chat-section">
                <div class="chat-feed" id="chatFeed">
                    <div class="message assistant">
                        <div class="msg-bubble">
                            Hello! I am Cosmo, your desktop voice assistant. How can I help you today?
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Bottom Command Bar -->
        <footer class="app-footer">
            <div class="input-bar">
                <input type="text" id="cmdInput" placeholder="Ask Cosmo anything..." onkeydown="handleKeyDown(event)">
                <button class="mic-toggle-btn" id="micBtn" onclick="toggleVoiceRecognition()" title="Toggle Voice">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="22"></line>
                    </svg>
                </button>
                <button class="send-btn" onclick="submitTextInput()" title="Send Command">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </footer>
        
        <!-- Settings Modal -->
        <div class="modal-overlay" id="settingsModal">
            <div class="modal-content">
                <h2>Settings</h2>
                <div class="settings-group">
                    <label for="apiKeyInput">Gemini API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="Enter your API Key here...">
                </div>
                <div class="settings-group">
                    <label for="voiceSelect">Voice Preference</label>
                    <select id="voiceSelect" style="background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); padding: 10px 12px; border-radius: var(--radius-md); color: var(--text-primary); outline: none;">
                    </select>
                </div>
                <div class="modal-actions">
                    <button class="btn secondary" onclick="toggleSettingsModal()">Cancel</button>
                    <button class="btn primary" onclick="saveSettings()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
